[package]
name = "wcag-doctor"
version = "0.1.0"
edition = "2021"
description = "WCAG 2.1 color contrast compliance checker for frontend projects"
license = "MIT"
repository = "https://github.com/suleymanozkeskin/wcag-doctor"
homepage = "https://github.com/suleymanozkeskin/wcag-doctor"
keywords = ["wcag", "accessibility", "contrast", "a11y", "tailwind"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
swc_ecma_parser = "35"
swc_ecma_ast = "21"
swc_common = "19"
swc_atoms = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
colored = "3"
globwalk = "0.9"
rayon = "1"
lightningcss = "1.0.0-alpha.71"
cssparser = "0.33"
parcel_selectors = "0.28.2"
json5 = "0.4"

[dev-dependencies]
tempfile = "3"
